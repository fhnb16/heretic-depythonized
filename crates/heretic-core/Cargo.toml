[package]
name = "heretic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
csv = "1.4.0"
dirs = "7.0.0"
fs2 = "0.4.3"
globset = "0.4.21"
minijinja = { version = "3.0.5", features = ["json", "loop_controls", "preserve_order", "builtins", "serde"] }
minijinja-contrib = { version = "3.0.5", features = ["pycompat", "datetime"] }
parquet = { version = "60.1.0", default-features = false, features = ["snap", "zstd", "lz4", "flate2", "flate2-rust_backend", "brotli"] }
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json"] }
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
