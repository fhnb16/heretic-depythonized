[package]
name = "heretic-gui"
description = "Heretic desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "heretic_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "3", features = ["json"] }
sha2 = "0.11.1"
heretic-core = { path = "../../../crates/heretic-core" }
heretic-engine = { path = "../../../crates/heretic-engine" }
heretic-optim = { path = "../../../crates/heretic-optim" }
heretic-plugins = { path = "../../../crates/heretic-plugins" }
heretic-session = { path = "../../../crates/heretic-session" }
heretic-export = { path = "../../../crates/heretic-export" }

[features]
# The frontend is plain HTML/JS in ../ui and is always embedded into the binary,
# so a plain `cargo build` produces a working application (no dev server, no Node.js).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cuda = ["heretic-engine/cuda"]
cudnn = ["heretic-engine/cudnn"]
mkl = ["heretic-engine/mkl"]
