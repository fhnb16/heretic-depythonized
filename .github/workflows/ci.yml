name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace

      - name: Run end-to-end tests (tiny models)
        run: cargo test --release -p heretic-session --test session -- --ignored --nocapture

  # The GUI frontend is plain HTML/CSS/JS without a build step (no Node.js). This renders
  # every screen with a mocked backend in headless Edge and fails on any JavaScript error.
  gui:
    name: GUI screens
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Render screens (light)
        shell: pwsh
        run: ./apps/heretic-gui/ui-test/screenshots.ps1 -Theme light

      - name: Render screens (dark)
        shell: pwsh
        run: ./apps/heretic-gui/ui-test/screenshots.ps1 -Theme dark

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: target/ui-shots/*.png
